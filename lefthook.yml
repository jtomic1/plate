pre-commit:
  piped: true
  commands:
    eslint:
      priority: 1
      glob: '*.{ts,mts,cts,js,mjs,cjs}'
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true
    prettier:
      priority: 2
      glob: '*.{ts,mts,cts,js,mjs,cjs,json,md,yml,yaml,html,css,scss}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
